# ─────────────────────────────────────────────────────────────────────────────
# kinematics.yaml — CONDICION MOVEIT2 BASE
#
# ESTADO DE VERIFICACION:
#   kinematics_solver .................. VERIFICADO (existe el plugin)
#       fuente: /opt/ros/humble/share/moveit_kinematics/
#               kdl_kinematics_plugin_description.xml
#   kinematics_solver_search_resolution . NO VERIFICADO
#   kinematics_solver_timeout .......... NO VERIFICADO
#
# No existe plantilla instalada de kinematics.yaml en este contenedor:
# moveit_setup_core_plugins y moveit_setup_srdf_plugins no traen carpeta
# templates/. Los dos valores numericos proceden de la documentacion publica
# de MoveIt como defecto del Setup Assistant, NO de un archivo local.
#
# Desviacion registrada del sistema afinado:
#   kuka_kr6_moveit_config/config/kinematics.yaml usa timeout 0.05
#   (10x el valor documentado como defecto). Aqui se usa 0.005.
#
# kinematics_solver_attempts: NO se declara. Es un parametro obsoleto en
# MoveIt 2.5.9 y no se pudo confirmar su vigencia con ninguna fuente local.
# ─────────────────────────────────────────────────────────────────────────────
manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
